name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest>=8,<10"
      - run: python -m pytest tests -q

  hermes:
    strategy:
      fail-fast: false
      matrix:
        # v2026.9.24 is Hermes 0.21.5, the requires_hermes floor.
        hermes: [v2026.9.24, main]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes }}
          path: hermes
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install Hermes
        working-directory: hermes
        run: uv sync --frozen --group dev || uv sync --frozen --extra dev
      - name: Validate
        working-directory: hermes
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          .venv/bin/python -m hermes_cli.main plugins validate "$GITHUB_WORKSPACE/aux-ledger"
          .venv/bin/python -m hermes_cli.main plugins validate "$GITHUB_WORKSPACE/stream-speed"
          .venv/bin/python -m hermes_cli.main plugins validate "$GITHUB_WORKSPACE/error-ledger"
          .venv/bin/python -m hermes_cli.main plugins validate "$GITHUB_WORKSPACE/approval-ledger"
          .venv/bin/python -m hermes_cli.main plugins validate "$GITHUB_WORKSPACE/command-ledger"
      - name: End to end (aux-ledger)
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes
        run: hermes/.venv/bin/python tests/e2e/hermes_e2e.py
      - name: End to end (stream-speed)
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes
        run: hermes/.venv/bin/python tests/e2e/stream_speed_e2e.py
      - name: End to end (error-ledger)
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes
        run: hermes/.venv/bin/python tests/e2e/error_ledger_e2e.py
      - name: End to end (approval-ledger)
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes
        run: hermes/.venv/bin/python tests/e2e/approval_ledger_e2e.py
      - name: End to end (command-ledger)
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes
        run: hermes/.venv/bin/python tests/e2e/command_ledger_e2e.py
